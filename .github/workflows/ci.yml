name: Customer portal CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: statistics-ci-disposable-local-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check statistics and role boundaries in Chromium
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/portal.log 2>&1 &
          node scripts/check-statistics-ui.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-ui
          path: test-artifacts/
          if-no-files-found: ignore
